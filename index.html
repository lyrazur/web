<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LyraZur Creations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #fafafa;
      color: #111;
    }

    header {
      padding: 60px 20px 40px;
      text-align: center;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 3rem;
      margin-bottom: 10px;
      color: #b08d2c; /* dark gold */
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #555;
      margin-top: 0;
    }

    nav {
      background: white;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 14px 20px;
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #444;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #d4af37;
    }

    section {
      padding: 40px 20px;
      text-align: center;
    }

    h2 {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .app-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      margin-top: 20px;
    }

    .app-list a {
      text-decoration: none;
      color: #111;
      padding: 14px 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      width: 260px;
      background: white;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    .app-list a:hover {
      border-color: #d4af37;
      color: #d4af37;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

<header>
  <h1>Welcome to LyraZur</h1>
  <p class="subtitle">My Playground</p>
</header>

</body>
</html>
