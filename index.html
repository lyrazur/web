<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lyrazur · QA Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #fafafa;
      color: #111;
    }

    header {
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    nav {
      background: white;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 14px 20px;
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 1rem;
    }

    nav a {
      text-decoration: none;
      color: #444;
      font-weight: 500;
      position: relative;
    }

    nav a:hover {
      color: #d4af37;
    }

    .submenu {
      margin-top: 40px;
      text-align: center;
    }

    .submenu h2 {
      font-family: "Playfair Display", serif;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .app-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .app-list a {
      text-decoration: none;
      color: #111;
      padding: 12px 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      width: 260px;
      background: white;
      transition: all 0.2s ease;
    }

    .app-list a:hover {
      border-color: #d4af37;
      color: #d4af37;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<header>
  <h1>Lyrazur QA Tools</h1>
  <p>Elegant utilities for software testers</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#software-testing">Software Testing</a>
</nav>

<section id="software-testing" class="submenu">
  <h2>Software Testing</h2>

  <div class="app-list">
    <a href="apps/test-data-forge/">Test Data Forge</a>
    <!-- další aplikace přidáš sem -->
  </div>
</section>

</body>
</html>
